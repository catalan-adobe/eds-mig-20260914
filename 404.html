<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page Not Found | Synopsys</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page Not Found | Synopsys">
  <meta name="template" content="error-page">
  <meta name="theme" content="site-content">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    import { siteRoot } from '/scripts/site.js';
    sampleRUM('404', { source: document.referrer });
    document.querySelector('main a[href="/"]').href = `${siteRoot()}/`;
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    /* the source's error page: black bold headings, an illustration at 95 % of its column */
    main .rich-text h2 strong {
      color: #3c3c3c;
    }

    main .error-image p {
      font-size: var(--body-font-size);
    }

    main .error-image .default-content-wrapper.image img {
      display: inline;
      width: 95%;
      vertical-align: baseline;
    }
  </style>
</head>

<body>
  <header></header>
  <main>
    <div class="span-6 rich-text band-top-md band-bottom-md">
      <h2><strong>Page not found. </strong></h2>
      <h2><strong>Let's find what you need.</strong></h2>
      <p>The page you wanted isn’t here anymore, but you don’t have to start over. Tell us what you need below and get an instant answer.</p>
    </div>
    <div class="span-6 stack">
      <p><strong><a href="/">Browse the homepage</a></strong></p>
    </div>
    <div class="span-6 bottom-sm error-image">
      <p><img src="/styles/404.svg" alt="404" width="1280" height="720"></p>
    </div>
  </main>
  <footer></footer>
</body>

</html>
